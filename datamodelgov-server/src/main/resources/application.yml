# JWT配置
jwt:
  secret: mySecretKeyForDataModelGov2024MySecretKeyForDataModelGov2024MySecretKeyForDataModelGov2024
  expiration: 28800000  # 8小时 (毫秒)
  refresh-expiration: 43200000  # 12小时 (毫秒)

# 服务器配置
server:
  port: 8080
  servlet:
    context-path: /
    # 针对 Tomcat 服务器的最大请求大小设置
  tomcat:
    max-swallow-size: -1  # 禁用上传大小限制

# IGinX连接配置（根据实际部署修改）
iginx:
  ip: 127.0.0.1
  port: 6888
  username: root
  password: root
  # IGinX操作超时配置（毫秒）
  # 用于全局锁等待超时，防止长时间阻塞
  timeout: 60000

# Spring配置
spring:
  application:
    name: 数据与模型一体化管理软件
  servlet:
    multipart:
      # 设置单个文件的最大大小，例如 2GB
      max-file-size: 2GB
      # 设置整个请求的最大大小（可用于多文件上传），例如 2GB
      max-request-size: 2GB
      # 设置阈值，当文件大于 100MB 时，就写入磁盘临时文件
      file-size-threshold: 100MB
      enabled: true
  devtools:
    restart:
      enabled: false
      additional-paths: src/main/resources/static/**
  mvc:
    pathmatch:
      matching-strategy: ANT_PATH_MATCHER
  web:
    resources:
      static-locations: file:./static/,classpath:/static/

#启用Swagger文档
springfox:
  documentation:
    enabled: true
    swagger-ui:
      enabled: true
knife4j:
  enable: false
  production: true

# MATLAB 仿真配置
matlab:
  engine:
    # true：用 MATLAB Engine API 驱动仿真（实时曲线 + 真实暂停/恢复/停止）
    # false：禁用引擎，仿真任务将直接标记 FAILED（不再回退到 matlab -batch）
    enabled: true
    # MATLAB 安装根目录（如 C:\Program Files\MATLAB\R2019b）。
    # 留空则按 MATLAB_ROOT 环境变量 → PATH 中的 matlab.exe → Program Files\MATLAB 下最新版本 顺序自动探测。
    # 服务启动时会用 JNA 把 <matlab.home>/bin/win64 注入到本进程的 DLL 搜索路径，
    # 因此通常无需再手动修改 PATH。
    home:
    # 引擎池最大并发数（含常驻引擎）。每个引擎是独立 MATLAB 进程，约占 1-2GB 内存。
    # 1：串行（旧行为）；4：最多 4 个仿真并发，第 5 个排队等待。
    pool-size: 2

# 离线缓存配置
offline:
  enabled: true
  cache-path: ./offline-cache


