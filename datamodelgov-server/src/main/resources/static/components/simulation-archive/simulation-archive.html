<div class="simulation-archive-list">
    <div class="list-header">
        <h2>搜索仿真档案</h2>
    </div>

    <div class="filter-section">
        <div class="filter-row">
            <div class="filter-item">
                <label>名称：</label>
                <input type="text" id="nameInput" placeholder="请输入档案名称">
            </div>
            <div class="filter-item">
                <label>项目名称：</label>
                <input type="text" id="projectNameInput" placeholder="请输入项目名称">
            </div>
            <div class="filter-item">
                <label>所有者：</label>
                <input type="text" id="ownerInput" placeholder="请输入所有者">
            </div>
            <div class="filter-item">
                <label>调度状态：</label>
                <select id="statusSelect">
                    <option value="">全部</option>
                    <option value="active">启用</option>
                    <option value="inactive">禁用</option>
                </select>
            </div>
            <div class="filter-actions">
                <button class="btn-primary" id="searchBtn">查询</button>
                <button class="btn-secondary" id="resetBtn">重置</button>
            </div>
        </div>
    </div>

    <div class="table-actions">
        <button class="btn-primary" id="addBtn">新增仿真档案</button>
    </div>

    <div class="table-section">
        <table>
            <thead>
                <tr>
                    <th>档案名称</th>
                    <th>描述</th>
                    <th>项目名称</th>
                    <th>所有者</th>
                    <th>最后修改时间</th>
                    <th>执行次数</th>
                    <th>调度配置</th>
                    <th>调度状态</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <tr><td colspan="9" style="text-align: center; padding: 20px;">加载中...</td></tr>
            </tbody>
        </table>
    </div>

    <div class="pagination-section">
        <span id="paginationInfo">第 1 / 1 页，共 0 条</span>
        <div class="pagination-actions">
            <button class="btn-secondary" id="prevBtn">上一页</button>
            <button class="btn-secondary" id="nextBtn">下一页</button>
        </div>
    </div>
</div>

<div class="modal-mask" id="modalMask" hidden>
    <div class="modal">
        <div class="modal-header">
            <span id="modalTitle">提示</span>
            <button class="modal-close" id="modalClose">×</button>
        </div>
        <div class="modal-body" id="modalBody"></div>
        <div class="modal-footer" id="modalFooter"></div>
    </div>
</div>
