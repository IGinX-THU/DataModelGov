<div class="change-password-container">
    <div class="change-password-header">
        <h3 class="change-password-title">修改密码</h3>
        <button class="close-btn" id="closeChangePasswordModal">&times;</button>
    </div>
    
    <div class="change-password-body">
        <form id="changePasswordForm">
            <div class="form-group">
                <label class="form-label">用户名</label>
                <input type="text" class="form-control" id="currentUsername" readonly />
                <div class="error-message" id="currentUsernameError"></div>
            </div>
            <div class="form-group">
                <label class="form-label required">原密码</label>
                <input type="password" class="form-control" id="oldPassword" placeholder="请输入原密码" required />
                <div class="error-message" id="oldPasswordError"></div>
            </div>
            <div class="form-group">
                <label class="form-label required">新密码</label>
                <input type="password" class="form-control" id="newPassword" placeholder="请输入新密码" required />
                <div class="error-message" id="newPasswordError"></div>
            </div>
            <div class="form-group">
                <label class="form-label required">确认新密码</label>
                <input type="password" class="form-control" id="confirmPassword" placeholder="请再次输入新密码" required />
                <div class="error-message" id="confirmPasswordError"></div>
            </div>
        </form>
    </div>
    
    <div class="change-password-footer">
        <button type="button" class="btn secondary" id="cancelChangePassword">取消</button>
        <button type="button" class="btn primary" id="confirmChangePassword">确认修改</button>
    </div>
</div>
