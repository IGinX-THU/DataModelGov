<div class="program-management">
    <div class="parsing-table-card">
        <div class="table-toolbar">
            <span class="toolbar-title">程序管理</span>
            <div class="toolbar-filters">
                <input type="text" id="filterName" placeholder="程序名称" class="filter-input">
                <input type="text" id="filterProject" placeholder="项目名称" class="filter-input">
                <button class="filter-btn" id="searchBtn">查询</button>
                <button class="filter-btn" id="resetFilterBtn">重置</button>
                <button class="filter-btn primary" id="showUploadBtn">上传程序</button>
            </div>
        </div>

        <div class="table-wrapper">
            <table class="data-table" id="programTable">
                <thead>
                    <tr>
                        <th>程序名称</th>
                        <th>版本</th>
                        <th>项目</th>
                        <th>描述</th>
                        <th>创建时间</th>
                        <th>状态</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
            <div class="empty-hint" id="emptyHint" hidden>暂无程序数据</div>
        </div>

        <div class="pagination-bar" id="paginationBar">
            <span class="page-info" id="pageInfo"></span>
            <div class="page-buttons">
                <button class="filter-btn" id="prevPageBtn">上一页</button>
                <span id="pageNumbers"></span>
                <button class="filter-btn" id="nextPageBtn">下一页</button>
            </div>
        </div>
    </div>

    <div class="config-modal hidden" id="configModal">
        <div class="modal-overlay" id="configOverlay"></div>
        <div class="modal-content">
            <div class="modal-header">
                <h3>程序配置 - <span id="configProgramName">-</span></h3>
                <button class="modal-close" id="configCloseBtn">✕</button>
            </div>
            <div class="modal-body">
                <div class="config-toolbar">
                    <label>配置模板：</label>
                    <select id="cfgTemplateSelect" style="min-width:160px;">
                        <option value="">选择模板...</option>
                    </select>
                    <button class="btn btn-sm" id="cfgApplyTemplateBtn" type="button">应用模板</button>
                    <span style="flex:1"></span>
                    <button class="btn btn-sm" id="cfgUploadJsonBtn" type="button">上传 JSON</button>
                    <input type="file" id="cfgUploadJsonInput" accept=".json,application/json" hidden>
                    <button class="btn btn-sm" id="cfgDownloadJsonBtn" type="button">下载 JSON</button>
                </div>
                <div class="config-section">
                    <h4>运行配置</h4>
                    <div class="form-row">
                        <label>预运行脚本</label>
                        <input type="text" id="cfgPreRunScript" placeholder="RunCtrlSysModelSHT">
                    </div>
                    <div class="form-row">
                        <label>Simulink 模型</label>
                        <input type="text" id="cfgSimulinkModel" placeholder="Dll_Control_AFO_V8_2_R2019b.slx">
                    </div>
                    <div class="form-row">
                        <label>停止时间</label>
                        <input type="number" id="cfgStopTime" placeholder="30" step="any">
                    </div>
                    <div class="form-row">
                        <label>固定步长</label>
                        <input type="text" id="cfgFixedStep" placeholder="Ts 或 0.025">
                    </div>
                    <div class="form-row">
                        <label>信号采集脚本（MATLAB 源码，function dmg_setup）</label>
                        <textarea id="cfgSetupScript" rows="10" placeholder="function dmg_setup()&#10;% 信号采集脚本&#10;...&#10;end" style="width:100%;font-family:monospace;font-size:12px;"></textarea>
                    </div>
                </div>
                <div class="config-section">
                    <h4>参数定义</h4>
                    <div id="paramConfigList"></div>
                    <button class="btn btn-sm" id="addParamBtn" type="button">+ 添加参数</button>
                </div>
                <div class="config-section">
                    <h4>信号采集</h4>
                    <div id="signalConfigList"></div>
                    <button class="btn btn-sm" id="addSignalBtn" type="button">+ 添加信号</button>
                </div>
                <div class="config-section">
                    <h4>页面布局</h4>
                    <div class="form-row">
                        <label>页面标题</label>
                        <input type="text" id="cfgUiTitle" placeholder="AFO 涡轴发动机">
                    </div>
                    <div class="form-row">
                        <label>布局方式</label>
                        <select id="cfgUiLayout">
                            <option value="tabs">tabs</option>
                            <option value="stacked">stacked</option>
                        </select>
                    </div>
                    <div id="sectionConfigList"></div>
                    <button class="btn btn-sm" id="addSectionBtn" type="button">+ 添加分区</button>
                </div>
                <div class="config-section">
                    <h4>扩展/插件</h4>
                    <div class="form-row">
                        <label>启用扩展</label>
                        <input type="checkbox" id="cfgExtEnabled">
                    </div>
                    <div class="form-row">
                        <label>加载模式</label>
                        <select id="cfgExtMode">
                            <option value="slot">slot（在指定槽位插入）</option>
                            <option value="override">override（接管整个页面）</option>
                        </select>
                    </div>
                    <div class="form-row">
                        <label>插件</label>
                        <select id="cfgExtEntry">
                            <option value="">不使用插件</option>
                        </select>
                    </div>
                    <div class="form-row">
                        <label>槽位 ID（slot 模式）</label>
                        <input type="text" id="cfgExtSlot" placeholder="extra-panel">
                    </div>
                </div>
                <div class="config-section">
                    <h4>原始 JSON</h4>
                    <textarea id="cfgRawJson" rows="10"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="configCancelBtn" type="button">取消</button>
                <button class="btn btn-primary" id="configSaveBtn" type="button">保存</button>
            </div>
        </div>
    </div>
</div>
