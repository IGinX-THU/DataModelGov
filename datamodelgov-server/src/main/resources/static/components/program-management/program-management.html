<div class="program-management">
    <div class="parsing-table-card">
        <div class="table-toolbar">
            <span class="toolbar-title">程序管理</span>
        </div>
        <div class="table-wrapper">
            <table class="data-table" id="programTable">
                <thead>
                    <tr>
                        <th>程序名称</th>
                        <th>版本</th>
                        <th>描述</th>
                        <th>创建时间</th>
                        <th>状态</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
            <div class="empty-hint" id="emptyHint" hidden>暂无程序数据</div>
        </div>
    </div>

    <div class="config-modal hidden" id="configModal">
        <div class="modal-overlay" id="configOverlay"></div>
        <div class="modal-content">
            <div class="modal-header">
                <h3>程序配置 - <span id="configProgramName">-</span></h3>
                <button class="modal-close" id="configCloseBtn">✕</button>
            </div>
            <div class="modal-body">
                <div class="config-section">
                    <h4>运行配置</h4>
                    <div class="form-row">
                        <label>模型名</label>
                        <input type="text" id="cfgSimulinkModel" placeholder="Dll_Control_AFO_V8_2_R2019b">
                    </div>
                    <div class="form-row">
                        <label>预运行脚本</label>
                        <input type="text" id="cfgPreRunScript" placeholder="RunCtrlSysModelSHT">
                    </div>
                    <div class="form-row">
                        <label>停止时间</label>
                        <input type="number" id="cfgStopTime" placeholder="30">
                    </div>
                </div>
                <div class="config-section">
                    <h4>系统模块</h4>
                    <div id="systemConfigList"></div>
                    <button class="btn btn-sm" id="addSystemBtn" type="button">+ 添加系统</button>
                </div>
                <div class="config-section">
                    <h4>输出信号</h4>
                    <div id="outputConfigList"></div>
                    <button class="btn btn-sm" id="addOutputBtn" type="button">+ 添加输出</button>
                </div>
                <div class="config-section">
                    <h4>原始 JSON</h4>
                    <textarea id="cfgRawJson" rows="6"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="configCancelBtn" type="button">取消</button>
                <button class="btn btn-primary" id="configSaveBtn" type="button">保存</button>
            </div>
        </div>
    </div>
</div>
