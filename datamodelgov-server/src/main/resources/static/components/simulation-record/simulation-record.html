<div class="visualization-container">
    <div class="visualization-header">
        <h3 class="visualization-title" id="analysisTitle">仿真记录</h3>
        <button class="close-btn" id="closeBtn">×</button>
    </div>
    
    <div class="content-area">
        <div class="chart-section">
            <div class="chart-header">
                <h4 class="chart-title">分析图表</h4>
                <div class="chart-actions">
                    <button class="toggle-btn" id="toggleInputBtn" title="切换输入数据显示">
                        输入数据
                    </button>
                    <button class="toggle-btn" id="toggleOutputBtn" title="切换输出数据显示">
                        输出数据
                    </button>
                </div>
            </div>
            <div class="chart-container" id="analysisChart">
                <!-- ECharts图表将在这里渲染 -->
            </div>
        </div>
        
        <!-- 数据表格区域 -->
        <div class="table-section">
            <div class="table-header">
                <h4 class="table-title">仿真记录数据</h4>
                <div class="table-controls">
                    <div class="filter-controls">
                        <label for="statusFilter">状态筛选:</label>
                        <select id="statusFilter" class="filter-select">
                            <option value="">全部</option>
                            <option value="running">运行中</option>
                            <option value="stopped">已停止</option>
                            <option value="success">成功</option>
                            <option value="failed">失败</option>
                        </select>
                        <label for="nameSearch">名称搜索:</label>
                        <input type="text" id="nameSearch" class="search-input" placeholder="搜索仿真名称">
                        
                        <!-- Time Range Selection -->
                        <div class="time-range-container">
                            <span class="time-range-label">时间范围:</span>
                            <input type="datetime-local" id="startTime" class="datetime-input" aria-label="开始时间">
                            <span class="time-range-separator">至</span>
                            <input type="datetime-local" id="endTime" class="datetime-input" aria-label="结束时间">
                        </div>
                        
                        <button class="toolbar-btn blue" id="searchBtn" title="搜索">
                            <i class="search-icon">🔍</i> 搜索
                        </button>
                    </div>
                    <div class="table-actions">
                        <button class="toolbar-btn poor" id="compareBtn" title="对比选中仿真">
                            对比
                        </button>
                        
                        <!-- Report Data Limit -->
                        <div class="report-limit-container">
                            <span class="report-limit-label">报告数据限制:</span>
                            <input type="number" id="reportDataLimit" class="report-limit-input" placeholder="条数" min="1" max="10000" value="20">
                            <span class="report-limit-unit">条</span>
                            <button class="help-icon" id="reportLimitHelp" title="查看帮助">?</button>
                        </div>
                        
                        <!-- Sampling Algorithm -->
                        <div class="sampling-algo-container">
                            <span class="sampling-algo-label">采样算法:</span>
                            <select id="samplingAlgorithm" class="sampling-algo-select">
                                <option value="uniform">均匀采样</option>
                                <option value="random">随机采样</option>
                                <option value="first">取前N条</option>
                                <option value="last">取后N条</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>
            <div class="table-wrapper">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th style="width: 40px; text-align: center;">
                                <input type="checkbox" id="selectAll" class="checkbox-all">
                            </th>
                            <th>档案名称</th>
                            <th>开始时间</th>
                            <th>结束时间</th>
                            <th>运行状态</th>
                            <th>错误信息</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <!-- 动态生成表格数据 -->
                    </tbody>
                </table>
            </div>
            <common-pagination id="pagination"></common-pagination>
        </div>
    </div>
</div>

<!-- 弹窗结构 -->
<div class="modal-mask" id="modalMask" hidden>
    <div class="modal-container">
        <div class="modal-header">
            <h3 class="modal-title" id="modalTitle">标题</h3>
            <button class="modal-close" id="modalClose">×</button>
        </div>
        <div class="modal-body" id="modalBody">
            <!-- 动态内容 -->
        </div>
        <div class="modal-footer" id="modalFooter">
            <!-- 动态按钮 -->
        </div>
    </div>
</div>
