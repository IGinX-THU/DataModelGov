<div class="app">
  <header>
    <div class="head-left">
      <span class="logo"></span>
      <span class="title">仿真运行</span>
      <span class="model-tag"></span>
    </div>
    <div class="head-right">
      <button class="btn btn-run"><span class="ico">▶</span>运行</button>
      <button class="btn btn-pause" disabled><span class="ico">⏸</span>暂停</button>
      <button class="btn btn-stop"><span class="ico">⏹</span>停止</button>
      <span class="time-box">0.00 / 0.00 s</span>
      <span class="status-box"><span class="dot"></span>待机</span>
      <button class="btn btn-fullscreen" id="fullscreenBtn" title="全屏显示 (Esc 退出)"><span class="ico">⛶</span></button>
      <button class="btn btn-close" id="closeBtn"><span class="ico">✕</span></button>
    </div>
  </header>
  <div class="body">
    <div class="run-loading-overlay" id="runLoadingOverlay" hidden>
      <div class="run-loading-spinner"></div>
      <div class="run-loading-text" id="runLoadingText">仿真启动中，请稍后...</div>
      <div class="run-loading-log" id="runLoadingLog"></div>
    </div>
    <aside class="left" id="leftPanel"></aside>
    <main>
      <div class="tabs"></div>
      <div class="content">
        <div class="chart-grid"></div>
      </div>
    </main>
    <aside class="right" id="rightPanel"></aside>
  </div>
  <footer>
    <div class="footer-log" id="footerLog">MATLAB 引擎状态查询中...</div>
    <div class="footer-actions"><button>⭳ 导出数据</button><button>💾 保存结果</button></div>
  </footer>
</div>
