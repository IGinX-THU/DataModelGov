<div class="algorithm-edit">
    <div class="form-container">
        <div class="form-header">
            <h2>编辑算法档案</h2>
            <button class="close-btn" id="closeBtn">×</button>
        </div>
        
        <div class="form-content">
            <!-- 1. 基本信息 -->
            <div class="section-card">
                <div class="section-title">基本信息</div>
                <div class="info-grid">
                    <div class="info-item">
                        <label>算法名称</label>
                        <input type="text" id="algorithmName" placeholder="请输入算法名称" readonly>
                    </div>
                    <div class="info-item">
                        <label>开发者</label>
                        <input type="text" id="developer" placeholder="请输入开发者">
                    </div>
                    <div class="info-item">
                        <label>版本号</label>
                        <input type="text" id="version" placeholder="请输入版本号" readonly>
                    </div>
                    <div class="info-item">
                        <label>场景</label>
                        <input type="text" id="scene" placeholder="请输入场景">
                    </div>
                    <div class="info-item full-width">
                        <label>描述信息</label>
                        <textarea id="description" placeholder="请输入算法描述信息" rows="3"></textarea>
                    </div>
                </div>
            </div>

            <!-- 2. 参数解析与数据绑定 -->
            <div class="section-card">
                <div class="section-title">参数解析与数据绑定</div>
                <!-- 自动解析工具栏 -->
                <div class="parse-toolbar">
                    <div class="toolbar-left">
                        <label>解析规则：</label>
                        <select class="parse-rules-select" id="parseRulesSelect">
                            <option value="">请选择解析规则</option>
                        </select>
                        <label class="second-label">源文件：</label>
                        <select class="source-file-select" id="sourceFileSelect">
                            <option value="">请选择源文件</option>
                        </select>
                    </div>
                    <div class="toolbar-right">
                        <label class="checkbox-label">
                            <input type="checkbox" id="forceOverrideCheck" checked>
                            <span>强制覆盖</span>
                        </label>
                        <button class="auto-parse-btn" id="autoParseBtn">从代码自动解析</button>
                        <button class="advanced-config-btn" id="advancedConfigBtn">高级配置</button>
                    </div>
                </div>
                <div class="annotation-spec-section" id="annotationSpecSection" style="display: none;">
                    <div class="spec-title">注释规范示例：</div>
                    <div class="spec-content" id="specContent"></div>
                </div>

                <!-- 数据绑定配置 -->
                <div class="binding-config data-binding-section">
                    <div class="binding-config-header">数据绑定</div>
                    <div class="binding-config-row">
                        <div class="binding-field">
                            <label>数据源</label>
                            <select id="dataSource" class="data-source-select">
                                <option value="">请选择数据源</option>
                            </select>
                        </div>
                        <div class="binding-field">
                            <label>运行命令</label>
                            <input type="text" id="ruleCmd" placeholder="python3 model_runner.py --input-file raw_data.csv --output-file result.csv">
                        </div>
                    </div>
                    <div class="binding-config-row">
                        <div class="binding-field">
                            <label>输入CSV文件名</label>
                            <input type="text" id="inputCsvName" placeholder="raw_data.csv">
                        </div>
                        <div class="binding-field">
                            <label>输出CSV文件名</label>
                            <div class="csv-field-with-btn">
                                <input type="text" id="outputCsvName" placeholder="result.csv">
                                <button type="button" class="gen-csv-header-btn" id="genCsvHeaderBtn" title="根据输出参数回写目标生成CSV表头">生成表头</button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 模型绑定配置 -->
                <div class="binding-config model-binding-section">
                    <div class="binding-config-header">模型绑定</div>
                    <div class="model-bind-list" id="modelBindList">
                        <!-- 动态添加模型绑定行 -->
                    </div>
                    <button type="button" class="add-model-bind-btn" id="addModelBindBtn">+ 添加模型</button>
                </div>

                <!-- Inputs（含数据源字段绑定列） -->
                <div class="params-block">
                    <div class="params-header">
                        <span>Inputs（输入参数）</span>
                        <button class="add-btn" id="addInputBtn">+</button>
                    </div>
                    <div class="params-table">
                        <div class="table-header">
                            <div class="col-name">参数名</div>
                            <div class="col-type">数据类型</div>
                            <div class="col-unit">物理单位</div>
                            <div class="col-bind">← 数据源字段</div>
                            <div class="col-desc">说明</div>
                            <div class="col-action">操作</div>
                        </div>
                        <div class="table-body" id="inputsBody">
                        </div>
                    </div>
                </div>
                <!-- Outputs（含回写目标列） -->
                <div class="params-block">
                    <div class="params-header">
                        <span>Outputs（输出参数）</span>
                        <button class="add-btn" id="addOutputBtn">+</button>
                    </div>
                    <div class="params-table">
                        <div class="table-header">
                            <div class="col-name">参数名</div>
                            <div class="col-type">数据类型</div>
                            <div class="col-unit">物理单位</div>
                            <div class="col-bind">→ 回写目标</div>
                            <div class="col-desc">说明</div>
                            <div class="col-action">操作</div>
                        </div>
                        <div class="table-body" id="outputsBody">
                        </div>
                    </div>
                </div>
            </div>

            <!-- 4. 输出格式 -->
            <div class="section-card">
                <div class="section-title">输出格式</div>
                <div class="output-format-section">
                    <div class="format-editor">
                        <label>格式模板（txt输出格式定义）</label>
                        <textarea id="outputFormat" placeholder="定义txt输出格式模板，使用 {{变量名}} 引用参数&#10;示例：&#10;[Algorithm] {{name}} v{{version}}&#10;[Input] {{input.temperature}} °C&#10;[Output] {{output.control_signal}} %" rows="8"></textarea>
                    </div>
                    <div class="format-preview">
                        <div class="preview-header">
                            <span>输出预览</span>
                            <button class="preview-btn" id="previewBtn">刷新预览</button>
                        </div>
                        <div class="preview-content" id="previewContent">
                            <pre>点击"刷新预览"查看输出效果</pre>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="form-actions">
            <button class="cancel-btn" id="cancelBtn">取消</button>
            <button class="save-btn" id="saveBtn">保存</button>
        </div>
    </div>
</div>
