<div class="parsing-rules">
    <div class="parsing-filter-card">
        <div class="filter-header">筛选</div>
        <div class="filter-rows">
            <div class="filter-row">
                <div class="filter-field">
                    <span class="filter-label">表前缀</span>
                    <input class="filter-input" type="text" placeholder="关键字（包含匹配）" id="prefixFilter" />
                </div>
            </div>
        </div>
        <div class="filter-actions">
            <div class="filter-spacer"></div>
            <button class="filter-btn outline" type="button" id="resetFilters">重置</button>
            <button class="filter-btn solid" type="button" id="applyFilters">查询</button>
        </div>
    </div>

    <div class="parsing-table-card">
        <div class="table-toolbar">
            <span class="toolbar-title">我拥有的数据表权限</span>
            <button class="toolbar-btn green" type="button" id="refreshBtn">刷新</button>
        </div>
        <div class="table-wrapper">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>表前缀</th>
                        <th>所有者</th>
                        <th>公开</th>
                        <th>可见用户</th>
                        <th>时间戳集合</th>
                        <th>创建时间</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
            <div class="empty-hint" id="emptyHint" hidden>暂无权限记录</div>
        </div>
        <common-pagination id="pagination"></common-pagination>
    </div>
</div>

<div class="modal-mask" id="modalMask" hidden>
    <div class="modal">
        <div class="modal-header">
            <span id="modalTitle">编辑权限</span>
            <button class="modal-close" id="closeModal">&times;</button>
        </div>
        <div class="modal-body" id="modalBody">
            <form id="permForm">
                <input type="hidden" id="recordId" />
                <div class="form-group">
                    <label class="form-label">表前缀</label>
                    <input type="text" class="form-control" id="displayTablePrefix" readonly />
                </div>
                <div class="form-group">
                    <label class="form-label required">是否公开</label>
                    <select class="form-control form-select" id="isPublic" required>
                        <option value="true">是（所有用户可见）</option>
                        <option value="false">否</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">可见用户</label>
                    <textarea class="form-control" id="visibleUsers" rows="3" placeholder="非公开时填写；多个用户名用英文逗号分隔，留空表示仅创建者可见"></textarea>
                </div>
            </form>
        </div>
        <div class="modal-footer" id="modalFooter">
            <button class="btn secondary" type="button" id="cancelBtn">取消</button>
            <button class="btn primary" type="button" id="saveBtn">保存</button>
        </div>
    </div>
</div>
